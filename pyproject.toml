[tool.poetry]
name = "ahmedkobtan_cinema_robot_playground"
version = "0.1.0"
description = ""
authors = ["Ahmed Kobtan - ahmedkobtan <akobtan@asu.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "==2.2.3"
numpy = "==2.2.3"
delta-spark = "2.3.0"
pydantic = "^2.12.5"
openpyxl = "^3.1.5"
pyarrow = "^22.0.0"
matplotlib = "^3.10.8"
ipykernel = "^7.1.0"
joblib = "^1.5.3"
pyyaml = "^6.0.3"
opencv-python = "^4.12.0.88"
pyserial = "3.5"
# ML and Vision Dependencies
torch = "^2.5.1"
torchvision = "^0.20.1"  # Updated for sam2 compatibility
transformers = "^4.57.3"
ultralytics = "^8.3.245"
# LangChain and Agentic AI
langchain = "^0.3.27"
langchain-community = "^0.3.31"
langchain-core = "^0.3.81"
ollama = "^0.1.9"
# Tracking and Segmentation
filterpy = "^1.4.5"  # For Kalman filter
scipy = "^1.16.3"  # For scientific computing
boxmot = "^16.0.6"  # Bot-SORT tracker
# Follow Anything (FAn) dependencies
open-clip-torch = "^3.2.0"  # Modern CLIP implementation (replaces old CLIP)
sam2 = "^1.1.0"  # Segment Anything Model 2 - requires torchvision >= 0.20.1
ftfy = "^6.1.1"  # For text processing
regex = "^2024.11.6"  # For text processing
# Utilities
loguru = "^0.7.3"  # Better logging
typing-extensions = "^4.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
coverage = "^7.5.1"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
# Only collect tests from tests/ directory, ignore scripts/
testpaths = ["tests"]
# Ignore scripts directory completely
norecursedirs = ["scripts", "*.egg", "*.eggs", ".git", ".tox", "dist", "build"]
# Only collect files that match test patterns in tests/ directory
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
